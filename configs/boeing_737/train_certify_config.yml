# ============================================================================
# Paths
# ============================================================================
concrete_samples_json: "configs/boeing_737/samples.json"
concrete_image_root: "Outputs/RenderedImages/boeing_737/cuboid"
abstract_folder: "Outputs/AbstractImages/boeing_737/cuboid/orbital"
checkpoint_dir: "weights/gatenet/boeing_737"
pretrained_checkpoint: "weights/gatenet/boeing_737/20260328_203204/final_model.pth"
