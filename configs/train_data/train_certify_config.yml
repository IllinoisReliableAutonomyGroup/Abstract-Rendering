# ============================================================================
# Paths
# ============================================================================
concrete_samples_json: "configs/train_data/samples.json"
concrete_image_root: "Outputs/RenderedImages/train_data/cylinder"
abstract_folder: "Outputs/AbstractImages/train_data/cylinder"
checkpoint_dir: "weights/gatenet/train_data"
pretrained_checkpoint: null  # or "path/to/checkpoint.pth"
run_datetime: "20260211_160120"

# ============================================================================
# Model Config
# ============================================================================
image_width: 32
image_height: 32
batch_norm_decay: 0.99
batch_norm_epsilon: 0.001

# ============================================================================
# Training Config
# ============================================================================
num_epochs: 50
batch_size_concrete: 10
batch_size_abstract: 2
num_workers: 4

# ============================================================================
# Loss Weights
# ============================================================================
lambda_concrete: 0.70
lambda_abstract: 0.30

# ============================================================================
# Optimizer Config
# ============================================================================
learning_rate: 0.0001
weight_decay: 0.00001

# ============================================================================
# CROWN Config
# ============================================================================
bound_method: "backward"  # Options: 'backward', 'forward', 'crown-ibp', 'ibp'

# ============================================================================
# Checkpointing
# ============================================================================
save_every: 5  # Save checkpoint every N epochs

use_reinforce: True  
reinforce_noise_std: 0.1